<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Activity: Grid System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container py-5">
    <!-- Page Title -->
    <h1 class="text-center fw-bold mb-5">Learning Activity: Grid System</h1>

    <div class="row justify-content-center">

      <!-- First Column -->
      <div class="col-12 col-md-6 mb-4 d-flex flex-column align-items-center">

        <!-- Option 1: Using Bootstrap width utility -->
        <img src="img/g.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        
        <!-- Option 2: Using Custom CSS (class: small-img) -->
        <img src="img/c.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">

        <!-- Option 3: Center + fixed width -->
        <div class="text-center w-100">
          <img src="img/p.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        </div>

        <!-- Repeat more images -->
        <img src="img/s.jpg" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        <img src="img/sq.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
      </div>

      <!-- Second Column -->
      <div class="col-12 col-md-6 mb-4 d-flex flex-column align-items-center">
        <img src="img/g.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        <img src="img/c.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        <div class="text-center w-100">
          <img src="img/p.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        </div>
        <img src="img/s.jpg" class="img-fluid mb-4 w-50" alt="Image (w-50)">
        <img src="img/sq.png" class="img-fluid mb-4 w-50" alt="Image (w-50)">
      </div>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
